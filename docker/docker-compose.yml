services:
  jd-saver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: jd-saver
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - JD_APP_KEY=${JD_APP_KEY}
      - JD_APP_SECRET=${JD_APP_SECRET}
      - JD_PID=${JD_PID}
      - JD_TOP_URL=${JD_TOP_URL:-https://api.jd.com/routerjson}
      - MCP_PORT=8765
      - DB_PATH=/data/jd_saver.db
      - PYTHONUNBUFFERED=1
    volumes:
      - jd-data:/data
      - ../cron_backup.sh:/usr/local/bin/cron_backup.sh:ro
    command: python server_sse.py
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jd-data:
