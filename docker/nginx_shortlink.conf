# nginx 短链接 302 重定向配置
# 部署到前端服务器 nginx，将 /go/{sku_id} 转发到后端 jd-saver
# 部署位置：/etc/nginx/conf.d/jd-saver.conf 或 included 配置块中

# ============================================================
# 短链接路由 — 代理到后端 /api/promo/{sku_id}
# 注意：需配合 WireGuard 隧道（后端 IP: 10.99.99.2）
# ============================================================
location ~* ^/go/(\d+)$ {
    # 只允许通过 nginx 访问，禁止直接访问上游
    # proxy_pass 会自动拼接 /api/promo/{sku_id}
    proxy_pass http://10.99.99.2:8765/api/promo/$1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

